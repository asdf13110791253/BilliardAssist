plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.billiardassist'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.billiardassist"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        // OpenCV 需要 Neon 支持
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        // 必须指定 NDK 路径，否则 CI 环境可能找不到
        ndkPath System.getenv("ANDROID_NDK_HOME")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 显式引入 Kotlin 标准库，防止隐式依赖冲突
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.10.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ===== 核心修复：修正为正确的 OpenCV Android 依赖坐标 =====
    // 原来的 'org.opencv:opencv:4.9.0' 是错误的，无法在 Maven 中找到
    implementation 'org.opencv:opencv-android:4.9.0'
    // ========================================================
}

// ============================================================
// 核心修复：强制统一 Kotlin 版本，解决 Duplicate Class 错误
// ============================================================
configurations.all {
    resolutionStrategy {
        // 强制使用 1.8.10
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'

        // 移除旧的三方库自带的 Kotlin 依赖，防止冲突
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                if (details.requested.name.startsWith('kotlin-stdlib')) {
                    details.useTarget 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
                }
            }
        }
    }
}
