plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.billiardassist'
    // 锁定 33：AGP 7.4.2 最高支持 33，升级需同步升级 AGP + Gradle
    compileSdk 33

    defaultConfig {
        applicationId "com.example.billiardassist"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        // OpenCV 架构过滤
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        // CI 环境请通过 local.properties 中的 ndk.dir 或 CI 环境变量（ANDROID_NDK_HOME）来配置 NDK 路径。
        // 在 defaultConfig 中设置 ndkPath 会导致 Gradle 报错：Unknown property on DefaultConfig
        // ndkPath System.getenv("ANDROID_NDK_HOME")
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            // 禁止调试版本生成崩溃分析符号，加快 CI 构建
            ext.enableCrashlytics = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // 脱糖：让 Java 8+ API 在低版本 Android 可用
        coreLibraryDesugaringEnabled true
    }

    // 解决 META-INF 冲突（OpenCV / AndroidX 常见）
    packagingOptions {
        resources {
            // 避免使用花括号或前导斜杠写法，逐项列出更可靠
            excludes += 'META-INF/AL2.0'
            excludes += 'META-INF/LGPL2.1'
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/NOTICE'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/LICENSE.txt'
            excludes += 'META-INF/NOTICE.txt'
            excludes += 'META-INF/*.kotlin_module'
        }
    }

    // CI 友好型 Lint 配置
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation', 'ExtraTranslation'
        // 禁止 Lint 在 CI 中占用大量内存
        htmlReport false
        xmlReport false
    }
}

dependencies {
    // ===== 核心脱糖库（Java 17 兼容关键）=====
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // ===== Kotlin 基础（强制统一版本）=====
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'

    // ===== AndroidX（降级到兼容 compileSdk 33 的版本）=====
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.10.1'          // ✅ 兼容 33
    implementation 'androidx.core:core-ktx:1.10.1'       // ✅ 兼容 33
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ===== OpenCV（已验证稳定）=====
    implementation 'org.opencv:opencv:4.9.0'
}

// ============================================================
// 强制统一 Kotlin 版本（根治 Duplicate Class）
// ============================================================
configurations.all {
    resolutionStrategy {
        // 强制锁定 Kotlin 版本
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'

        // 替换所有第三方库自带的 Kotlin 依赖
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                if (details.requested.name.startsWith('kotlin-stdlib')) {
                    details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:1.8.10"
                }
            }
        }
    }
}
