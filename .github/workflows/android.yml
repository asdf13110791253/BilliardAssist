name: Android CI
# 触发条件：推送/PR到main分支时自动构建
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 第一步：拉取你的项目代码到构建服务器
      - name: Checkout code
        uses: actions/checkout@v4

      # 第二步：配置JDK环境
      # 安卓Gradle插件7.x兼容JDK11，如果后续升级到AGP8+需要改成JDK17
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle # 自动缓存Gradle依赖，加快后续构建速度

      # 第三步：同意Android SDK许可（安卓自动化构建必踩的坑，不加会报错）
      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

      # 第四步：给Gradle启动脚本加执行权限（解决你之前找不到gradlew的报错，前提是仓库里必须有gradlew文件）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 第五步：构建APK（先清理旧构建产物，只打Debug包，跳过测试避免没写测试导致失败）
      - name: Build Debug APK
        run: ./gradlew clean assembleDebug -x test --no-daemon

      # 第六步：把构建好的APK上传到GitHub可下载区
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAssist-Debug
          path: app/build/outputs/apk/debug/app-debug.apk # Debug包默认存放路径
          retention-days: 7 # APK自动保留7天，可根据需要修改天数
