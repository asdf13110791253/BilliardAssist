# ============================================================
#  LingMiao 自动构建工作流
#  推送到 main/master 分支时自动编译 Debug & Release APK
#  也可在 GitHub 网页上手动触发 (Actions → Run workflow)
# ============================================================

name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------------
      # 1. 拉取代码
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. 设置 JDK 17
      # --------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # --------------------------------------------------------
      # 【关键修复】3. 强制清除所有 Gradle 缓存
      # --------------------------------------------------------
      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf gradle/wrapper/dists/

      # --------------------------------------------------------
      # 【核心修复】4. 使用官方 Action 修复 Wrapper
      # 这比手动装 Gradle 更稳定，能确保 jar 包完整
      # --------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '7.5'

      # --------------------------------------------------------
      # 5. 强制重新生成 Wrapper JAR (针对 7.5 版本)
      # --------------------------------------------------------
      - name: Regenerate Gradle Wrapper
        run: |
          rm -rf gradle/wrapper/
          gradle wrapper --gradle-version 7.5 --distribution-type bin
          ls -la gradle/wrapper/
          file gradle/wrapper/gradle-wrapper.jar

      # --------------------------------------------------------
      # 6. 设置 Android SDK + 接受 License
      # --------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      # --------------------------------------------------------
      # 7. 安装 NDK 和 CMake
      # --------------------------------------------------------
      - name: Install NDK & CMake
        run: |
          sdkmanager "ndk;26.1.10909125"
          sdkmanager "cmake;3.22.1"
          echo "NDK_PATH=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      # --------------------------------------------------------
      # 8. 配置国内 Maven 镜像加速
      # --------------------------------------------------------
      - name: Configure Gradle mirror
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  google()
                  mavenCentral()
              }
          }
          EOF

      # --------------------------------------------------------
      # 9. 赋予 gradlew 执行权限
      # --------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x gradlew

      # --------------------------------------------------------
      # 10. 编译 Debug APK
      # --------------------------------------------------------
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      # --------------------------------------------------------
      # 11. 编译 Release APK
      # --------------------------------------------------------
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      # --------------------------------------------------------
      # 12. 显示构建产物信息
      # --------------------------------------------------------
      - name: Show APK info
        run: |
          echo "===== Debug APK ====="
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || echo "(未生成)"
          echo ""
          echo "===== Release APK ====="
          ls -lh app/build/outputs/apk/release/ 2>/dev/null || echo "(未生成)"

      # --------------------------------------------------------
      # 13. 上传 Debug APK
      # --------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # --------------------------------------------------------
      # 14. 上传 Release APK
      # --------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: LingMiao-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
