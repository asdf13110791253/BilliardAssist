name: Android CI
# 触发条件：推送/PR到main分支时自动构建APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 拉取你的项目代码到构建服务器
      - name: Checkout code
        uses: actions/checkout@v4

      # 👉 核心：指定用JDK17，解决你之前点错的版本问题
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # 自动缓存依赖，下次构建快很多

      # 安卓构建必选：同意SDK许可，避免报组件缺失错误
      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses

      # 给Gradle启动脚本加执行权限（确保仓库根目录有gradlew文件哦）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 构建Debug包，跳过测试加快速度，--no-daemon避免构建超时
      - name: Build Debug APK
        run: ./gradlew clean assembleDebug -x test --no-daemon

      # 自动上传构建好的APK，方便直接下载
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAssist-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7 # APK自动保留7天，可按需改天数
