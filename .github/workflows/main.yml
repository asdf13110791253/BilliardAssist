name: Build LingMiao V2.0 APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 重新生成完整可用Gradle 8.7 Wrapper，修复NoClassDefFoundError缺失类问题
      - name: Rebuild Gradle Wrapper 8.7
        run: |
          rm -rf gradle gradlew gradle-8.7* gradle-8.7-bin.zip wrapper-tmp.zip
          mkdir -p gradle/wrapper
          # 使用gitee镜像下载完整gradle包，避免ghproxy返回html
          wget --no-check-certificate https://mirrors.gitee.com/maven/gradle/gradle-8.7-all.zip -O wrapper-tmp.zip
          unzip -q wrapper-tmp.zip "gradle-8.7.0/gradle/wrapper/gradle-wrapper.jar"
          cp gradle-8.7.0/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          echo "#!/bin/sh" > gradlew
          echo "exec java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \$@" >> gradlew
          chmod +x gradlew
          rm -rf gradle-8.7.0 wrapper-tmp.zip

      - name: Configure Android SDK Mirror
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          echo "dl.google.com=https://mirrors.cloud.tencent.com/google/" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

      - name: Download OpenCV so library
        run: |
          mkdir -p native_libs
          download_with_retry() {
            local url="$1"
            local output="$2"
            local max_retries=3
            local mirrors=(
              "https://ghproxy.cn/${url#https://}"
              "$url"
            )
            for mirror in "${mirrors[@]}"; do
              for ((i=1; i<=max_retries; i++)); do
                echo "尝试下载镜像 $mirror 第$i次"
                rm -f "$output"
                if wget --no-check-certificate --timeout=120 -O "$output" "$mirror"; then
                  local size=$(stat -c%s "$output")
                  if [ $size -gt 100000 ]; then
                    echo "✅ 文件下载完成，大小：$size 字节"
                    return 0
                  else
                    echo "❌ 文件过小，判定为404页面，重新下载"
                    rm -f "$output"
                  fi
                fi
              done
            done
            echo "❌ 所有镜像下载失败，终止流水线"
            exit 1
          }
          download_with_retry "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip" native_libs/opencv.zip
          unzip -q native_libs/opencv.zip -d native_libs/opencv-sdk
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp native_libs/opencv-sdk/OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp native_libs/opencv-sdk/OpenCV-android-sdk/sdk/native/libs/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/
          echo "✅ so库复制完成"

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 灵喵台球-Release正式安装包
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
