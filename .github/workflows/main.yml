name: Android CI (Stable Native)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # 使用 GitHub 提供的标准 Ubuntu 环境
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 【关键】强制使用 JDK 17，并清除缓存
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          check-latest: true # 确保下载最新的 JDK 17，而不是用缓存的旧版

      # 3. 设置 Android SDK 环境变量
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 这里指定你需要编译的 Android SDK 版本和构建工具版本
          # 如果你的项目用的是 API 34，就写 34
          api-level: 34
          build-tools-version: "34.0.0"
          # 接受所有许可，避免之前那个报错
          accept-android-sdk-licenses: true

      # 4. 给 Gradle 执行权限（确保仓库根目录有 gradlew 文件）
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. 构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew clean assembleDebug -x test --no-daemon

      # 6. 上传 APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAssist-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
