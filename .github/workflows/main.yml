# ============================================================
#  LingMiao 自动构建工作流
#  推送到 main/master 分支时自动编译 Debug & Release APK
#  也可在 GitHub 网页上手动触发 (Actions → Run workflow)
# ============================================================

name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------------
      # 1. 拉取代码
      # --------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. 设置 JDK 17
      # --------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # --------------------------------------------------------
      # 【关键修复】3. 强制清除所有 Gradle 缓存（防止坏 Jar 复活）
      # --------------------------------------------------------
      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf gradle/wrapper/dists/

      # --------------------------------------------------------
      # 4. 确保 gradle-wrapper.jar 存在且有效
      #    即使文件存在，也强制重新生成，确保类文件完整
      # --------------------------------------------------------
      - name: Ensure Gradle Wrapper JAR exists
        run: |
          # 删除旧的 wrapper 目录，强制重新生成
          rm -rf gradle/wrapper/
          # 使用项目现有的 properties 配置来生成 wrapper
          # 如果你的项目用的是 7.x，这里会自动识别，不需要写死 8.4
          gradle wrapper
          ls -la gradle/wrapper/
          # 验证 jar 文件有效
          file gradle/wrapper/gradle-wrapper.jar

      # --------------------------------------------------------
      # 5. 设置 Android SDK + 接受 License
      # --------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      # --------------------------------------------------------
      # 6. 安装 NDK 和 CMake
      # --------------------------------------------------------
      - name: Install NDK & CMake
        run: |
          sdkmanager "ndk;26.1.10909125"
          sdkmanager "cmake;3.22.1"
          echo "NDK_PATH=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      # --------------------------------------------------------
      # 7. 配置国内 Maven 镜像加速
      # --------------------------------------------------------
      - name: Configure Gradle mirror
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'EOF'
          allprojects {
              repositories {
                  maven { url 'https://maven.aliyun.com/repository/public' }
                  maven { url 'https://maven.aliyun.com/repository/google' }
                  google()
                  mavenCentral()
              }
          }
          EOF

      # --------------------------------------------------------
      # 8. 缓存 Gradle 依赖（现在缓存是干净的）
      # --------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # --------------------------------------------------------
      # 9. 赋予 gradlew 执行权限
      # --------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x gradlew

      # --------------------------------------------------------
      # 10. 编译 Debug APK
      # --------------------------------------------------------
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      # --------------------------------------------------------
      # 11. 编译 Release APK（无签名，方便后续自己签名）
      # --------------------------------------------------------
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      # --------------------------------------------------------
      # 12. 显示构建产物信息
      # --------------------------------------------------------
      - name: Show APK info
        run: |
          echo "===== Debug APK ====="
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || echo "(未生成)"
          echo ""
          echo "===== Release APK ====="
          ls -lh app/build/outputs/apk/release/ 2>/dev/null || echo "(未生成)"

      # --------------------------------------------------------
      # 13. 上传 Debug APK（保留 30 天）
      # --------------------------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # --------------------------------------------------------
      # 14. 上传 Release APK（如果存在）
      # --------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: LingMiao-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
