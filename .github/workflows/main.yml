name: LingMiao V2 Build Release APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build_task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full source code
        uses: actions/checkout@v4

      - name: Setup JDK 17 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Fix project Gradle Wrapper Version
        run: |
          mkdir -p gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" > gradle/wrapper/gradle-wrapper.properties

          download_gradle() {
              local origin_url="https://services.gradle.org/distributions/gradle-8.7-all.zip"
              local proxy_url="https://ghproxy.com/${origin_url#https://}"
              rm -f temp_gradle_all.zip
              echo "使用Github代理加速下载Gradle完整包"
              if wget --timeout=180 --no-check-certificate -O temp_gradle_all.zip "$proxy_url"; then
                  local size=$(stat -c%s temp_gradle_all.zip)
                  if [ $size -gt 200000000 ]; then
                      echo "压缩包下载成功，文件大小：$size"
                      return 0
                  fi
              fi
              echo "代理下载失败，切换github直连"
              wget --timeout=180 --no-check-certificate -O temp_gradle_all.zip "$origin_url"
          }

          download_gradle

          unzip -q temp_gradle_all.zip "gradle-8.7.0/gradle/wrapper/gradle-wrapper.jar"
          cp gradle-8.7.0/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/

          cat > gradlew << 'EOF'
#!/bin/sh
exec java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "$@"
EOF
          chmod +x gradlew

          rm -rf gradle-8.7.0 temp_gradle_all.zip

      - name: Install Android SDK Toolchain
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: "26.1.10909125"
          build-tools: "34.0.0"

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Pull OpenCV native library
        run: |
          mkdir -p native_libs
          safe_fetch_lib() {
            local target_url="$1"
            local save_file="$2"
            local retry_max=3
            local mirror_list=(
              "https://ghproxy.com/${target_url#https://}"
              "https://ghproxy.cn/${target_url#https://}"
              "$target_url"
            )
            rm -f "$save_file"
            for mirror in "${mirror_list[@]}"; do
              for ((loop=1; loop<=retry_max; loop++)); do
                echo "OpenCV下载 第$loop次，镜像源：$mirror"
                if wget --timeout=120 --no-check-certificate -O "$save_file" "$mirror"; then
                  local f_size=$(stat -c%s "$save_file")
                  if [ $f_size -gt 120000 ]; then
                    echo "OpenCV包下载完成，文件大小：$f_size 字节"
                    return 0
                  fi
                fi
                rm -f "$save_file"
              done
            done
            echo "全部镜像下载OpenCV失败，退出流水线"
            exit 2
          }
          safe_fetch_lib "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip" native_libs/opencv49.zip
          unzip -q native_libs/opencv49.zip -d native_libs/opencv_out
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp native_libs/opencv_out/OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp native_libs/opencv_out/OpenCV-android-sdk/sdk/native/libs/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-V2-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
