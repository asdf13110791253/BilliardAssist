name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Latest)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 配置国内镜像，解决 NDK 下载超时问题
      - name: Configure Android SDK Mirror
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          echo "dl.google.com=https://mirrors.cloud.tencent.com/google/" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.1.10909125" "build-tools;30.0.3" "platforms;android-33"

      # 手动安装纯净版 Gradle 8.9，彻底绕过 wrapper 损坏问题
      - name: Install Gradle 8.9
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle.zip
          unzip -o gradle.zip -d /opt/gradle
          echo "GRADLE_HOME=/opt/gradle/gradle-8.9" >> $GITHUB_ENV
          echo "$GRADLE_HOME/bin" >> $GITHUB_PATH

      # 清理残留缓存，避免环境冲突
      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      # 直接使用系统级 Gradle 构建，不再依赖项目内的 gradlew
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAssist-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
