name: Android CI (Fixed JDK 17)
# 触发条件：推送/PR到main分支时自动构建
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 【关键修复】强制设置 JDK 17，并清除可能存在的旧缓存
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          # 加上这行，确保覆盖系统自带的或其他版本的Java
          override: true 

      # 3. 验证 Java 版本（调试用，确认是否是17）
      - name: Verify Java Version
        run: java -version

      # 4. 设置 Android SDK 环境
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. 同意 SDK 许可证
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      # 6. 给 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 7. 构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew clean assembleDebug -x test --no-daemon

      # 8. 上传 APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAssist-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
