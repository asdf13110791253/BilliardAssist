name: Build LingMiao V2.0 APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pull full project source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 全局安装Gradle8.7，不依赖项目内gradlew/wrapper，彻底解决wrapper类缺失
      - name: Global install Gradle 8.7
        run: |
          sudo apt update -y
          sudo apt install wget unzip -y
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle-bin.zip
          sudo unzip -q /tmp/gradle-bin.zip -d /opt/
          sudo ln -s /opt/gradle-8.7 /opt/gradle
          echo "PATH=$PATH:/opt/gradle/bin" >> $GITHUB_ENV

      # 安卓依赖国内镜像配置
      - name: Config Android mirror source
        run: |
          mkdir -p ~/.android
          echo "dl.google.com=https://mirrors.cloud.tencent.com/android/" >> $GITHUB_ENV
          echo "maven.google.com=https://mirrors.cloud.tencent.com/maven-google/" >> $GITHUB_ENV

      # 一键安装SDK、NDK、构建工具
      - name: Deploy Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: "26.1.10909125"
          build-tools: "34.0.0"

      - name: Accept all SDK license agreements
        run: yes | sdkmanager --licenses

      # 安全下载OpenCV库，多重镜像校验
      - name: Download OpenCV 4.9 native lib
        run: |
          mkdir -p native_libs/jni
          safe_fetch() {
            local source_url="$1"
            local save_file="$2"
            local retry_max=3
            local proxy_group=(
              "https://ghproxy.com/${source_url#https://}"
              "https://ghproxy.cn/${source_url#https://}"
              "$source_url"
            )
            rm -f "$save_file"
            for proxy_addr in "${proxy_group[@]}"; do
              for ((loop=1; loop<=retry_max; loop++)); do
                echo "Download attempt $loop, proxy: $proxy_addr"
                if wget --timeout=120 --no-check-certificate -O "$save_file" "$proxy_addr"; then
                  local f_size=$(stat -c%s "$save_file")
                  if [ $f_size -gt 120000 ]; then
                    echo "File download success, size: $f_size bytes"
                    return 0
                  fi
                fi
                rm -f "$save_file"
              done
            done
            echo "All download proxy failed, stop workflow"
            exit 2
          }
          safe_fetch "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip" native_libs/opencv.zip
          unzip -q native_libs/opencv.zip -d native_libs/opencv-sdk
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp native_libs/opencv-sdk/OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp native_libs/opencv-sdk/OpenCV-android-sdk/sdk/native/libs/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/

      # 全局gradle命令打包，不再使用./gradlew（根治wrapper缺失类报错）
      - name: Build Release APK with global Gradle
        run: gradle assembleRelease --stacktrace
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      # 上传编译好的安装包
      - name: Upload compiled APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-V2.0-Final-Release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
