name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix broken Gradle wrapper lightweight
        run: |
          chmod +x gradlew
          mkdir -p gradle/wrapper
          # 原始jar地址
          JAR_URL="https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle-wrapper/gradle-wrapper.jar"
          # 第一路镜像下载
          wget --no-check-certificate --timeout=60 -O gradle/wrapper/gradle-wrapper.jar https://mirror.ghproxy.com/${JAR_URL#https://}
          # 校验文件大小，正常jar大于30KB
          FILESIZE=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          if [ $FILESIZE -lt 30000 ]; then
            echo "❌ 第一次下载文件异常（仅$FILESIZE字节），切换备用镜像重下"
            rm -f gradle/wrapper/gradle-wrapper.jar
            wget --no-check-certificate --timeout=60 -O gradle/wrapper/gradle-wrapper.jar https://ghproxy.cn/${JAR_URL#https://}
          fi
          # 写入gradle版本配置
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" > gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK Mirror
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          echo "dl.google.com=https://mirrors.cloud.tencent.com/google/" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.1.10909125" "build-tools;33.0.2" "platforms;android-33"

      - name: Download OpenCV so library
        run: |
          mkdir -p native_libs
          download_with_retry() {
            local url="$1"
            local output="$2"
            local max_retries=3
            local mirrors=(
              "https://mirror.ghproxy.com/${url#https://}"
              "https://ghproxy.cn/${url#https://}"
              "$url"
            )
            for mirror in "${mirrors[@]}"; do
              for ((i=1; i<=max_retries; i++)); do
                echo "尝试下载镜像 $mirror 第$i次"
                rm -f "$output"
                if wget --no-check-certificate --timeout=120 -O "$output" "$mirror"; then
                  local size=$(stat -c%s "$output")
                  if [ $size -gt 100000 ]; then
                    echo "✅ 文件下载完成，大小：$size 字节"
                    return 0
                  else
                    echo "❌ 文件过小，判定为404页面，重新下载"
                    rm -f "$output"
                  fi
                fi
              done
            done
            echo "❌ 所有镜像下载失败，终止流水线"
            exit 1
          }
          download_with_retry "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip" native_libs/opencv.zip
          unzip -q native_libs/opencv.zip -d native_libs/opencv-sdk
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp native_libs/opencv-sdk/OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp native_libs/opencv-sdk/OpenCV-android-sdk/sdk/native/libs/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/
          echo "✅ so库复制完成"

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: 灵喵台球-Release正式安装包
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
