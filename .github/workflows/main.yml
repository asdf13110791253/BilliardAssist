name: Build LingMiao V2.0 APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pull Source Code
        uses: actions/checkout@v4

      - name: Install JDK 17 Temurin
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 官方内置Gradle 8.7，全程无手动下载zip包，彻底规避解压报错
      - name: Init Gradle Env
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          validate-wrappers: false
          cache-gradle-home: true

      # 配置安卓国内镜像源
      - name: Android Repo Mirror Config
        run: |
          mkdir -p ~/.android
          echo "dl.google.com=https://mirrors.cloud.tencent.com/android/" >> $GITHUB_ENV
          echo "maven.google.com=https://mirrors.cloud.tencent.com/maven-google/" >> $GITHUB_ENV

      # 安装安卓SDK与NDK
      - name: Install Android SDK Toolchain
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: "26.1.10909125"
          build-tools: "34.0.0"

      # 同意SDK全部许可协议
      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      # 下载OpenCV依赖库（带文件大小校验，过滤无效网页文件）
      - name: Fetch OpenCV 4.9.0 Native Library
        run: |
          mkdir -p native_libs/app_jni
          safe_download() {
            local target_url="$1"
            local save_path="$2"
            local retry_count=3
            local proxy_list=(
              "https://ghproxy.com/${target_url#https://}"
              "https://ghproxy.cn/${target_url#https://}"
              "$target_url"
            )
            rm -f "$save_path"
            for proxy in "${proxy_list[@]}"; do
              for ((t=1; t<=retry_count; t++)); do
                echo "Attempt $t, Source: $proxy"
                if wget --timeout=100 --no-check-certificate -O "$save_path" "$proxy"; then
                  local file_size=$(stat -c%s "$save_path")
                  if [ $file_size -gt 150000 ]; then
                    echo "Download complete, file size: $file_size bytes"
                    return 0
                  fi
                fi
                rm -f "$save_path"
              done
            done
            echo "All download source failed, terminate workflow"
            exit 2
          }
          safe_download "https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip" native_libs/opencv490.zip
          unzip -q native_libs/opencv490.zip -d native_libs/opencv-sdk
          # 拷贝arm64-v8a架构so文件到项目jniLibs目录
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp native_libs/opencv-sdk/OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp native_libs/opencv-sdk/OpenCV-android-sdk/sdk/native/libs/armeabi-v7a/*.so app/src/main/jniLibs/armeabi-v7a/

      # 赋予构建脚本执行权限
      - name: Add Execute Permission To Gradlew
        run: chmod u+x gradlew

      # 打包Release安装包
      - name: Compile Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      # 上传编译产物
      - name: Export Build APK
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-V2.0-Release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
