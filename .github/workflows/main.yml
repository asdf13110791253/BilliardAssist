name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 配置国内镜像
      - name: Configure Android SDK Mirror
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          echo "dl.google.com=https://mirrors.cloud.tencent.com/google/" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.1.10909125" "build-tools;30.0.3" "platforms;android-33"

      # ============================================================
      # 核心修复：强制安装 Gradle 7.5（与你本地环境保持一致）
      # ============================================================
      - name: Install Gradle 7.5
        run: |
          wget https://services.gradle.org/distributions/gradle-7.5-bin.zip -O gradle.zip
          unzip -o gradle.zip -d /opt/gradle
          echo "GRADLE_HOME=/opt/gradle/gradle-7.5" >> $GITHUB_ENV
          echo "/opt/gradle/gradle-7.5/bin" >> $GITHUB_PATH

      # 清理缓存，确保不使用 9.x 的残留数据
      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      # 使用 gradle 命令（此时调用的一定是 7.5）
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAssist-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
