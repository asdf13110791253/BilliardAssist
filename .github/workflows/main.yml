name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 增加超时时间，防止下载慢被强制终止

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Latest)
        uses: actions/setup-java@v5  # 已升级到 v5，解决弃用警告
        with:
          java-version: '17'
          distribution: 'temurin'

      # 关键步骤：配置国内镜像，彻底解决 NDK 下载卡死/超时问题
      - name: Configure Android SDK Mirror
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          # 使用腾讯云镜像加速 Google 下载
          echo "dl.google.com=https://mirrors.cloud.tencent.com/google/" >> $GITHUB_ENV

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install NDK
        run: |
          yes | sdkmanager --licenses
          # 有了镜像源，这里下载会飞快，不会超时了
          sdkmanager "ndk;26.1.10909125" "build-tools;30.0.3" "platforms;android-33"

      # 手动锁定 Gradle 8.9，确保环境绝对纯净
      - name: Install Gradle 8.9
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle.zip
          unzip -o gradle.zip -d /opt/gradle
          echo "GRADLE_HOME=/opt/gradle/gradle-8.9" >> $GITHUB_ENV
          echo "$GRADLE_HOME/bin" >> $GITHUB_PATH

      - name: Clean Gradle Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAssist-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
