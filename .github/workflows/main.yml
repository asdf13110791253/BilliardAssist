name: Android CI (Docker Stable)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # 使用 Google 官方的安卓构建镜像，里面预装了 JDK 17 和最新的 Android SDK
    # 这是解决 Java 版本冲突的最强方案
    runs-on: ubuntu-latest
    container: ghcr.io/android-actions/android-build:latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 验证容器内 Java 版本（你会看到它绝对是 17）
      - name: Verify Java Version inside Container
        run: java -version

      # 3. 给 Gradle 执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 构建 Debug APK
      # 注意：在容器里我们不需要手动接受 SDK 许可，镜像已经处理好了
      - name: Build Debug APK
        run: ./gradlew clean assembleDebug -x test --no-daemon

      # 5. 上传 APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BilliardAssist-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
