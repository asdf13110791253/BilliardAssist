name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. 安装 Android SDK 和 NDK
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accept-licenses: false

    - name: Install NDK and Tools
      run: |
        sdkmanager "platforms;android-34"
        sdkmanager "build-tools;34.0.0"
        sdkmanager "ndk;26.1.10909125"

    # 2. 从腾讯云下载纯净版 Gradle
    - name: Download Gradle from Tencent Mirror
      run: |
        wget --no-verbose --output-document=/tmp/gradle.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
        unzip -q /tmp/gradle.zip -d /tmp/

    # 🔥 【终极清理】：在正式编译前，强制清理掉旧包名的残留缓存！
    - name: Purge Old Cache
      run: |
        rm -rf ~/.gradle/caches/
        /tmp/gradle-8.7/bin/gradle clean --no-daemon

    # 3. 使用本地 Gradle 开始编译
    - name: Build Debug APK
      run: |
        /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon

    # 4. 上传 APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
