name: LingMiao V2 Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: "26.1.10909125"

      - name: 修复Gradle包装器
        run: |
          rm -rf gradle/wrapper gradlew
          mkdir -p gradle/wrapper
          
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://gitee.com/mirrors/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          cat > gradlew << 'EOF'
          #!/bin/sh
          exec "$JAVA_HOME/bin/java" -classpath "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          
          chmod +x gradlew
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: 下载OpenCV so库
        run: |
          mkdir native_libs
          wget --no-check-certificate https://ghfast.top/https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip -O opencv.zip
          filesize=$(stat -c%s opencv.zip)
          if [ $filesize -lt 1000000 ]; then
              echo "❌ 下载文件异常"
              exit 1
          fi
          echo "✅ OpenCV下载成功"
          unzip -q opencv.zip -d native_libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native_libs/OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/

      - name: 打包Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      # ✅ 智能查找并上传APK
      - name: 查找并上传APK
        id: upload_apk
        run: |
          echo "🔍 正在查找APK文件..."
          
          # 查找所有APK
          APK_FILES=$(find app/build -name "*.apk" -type f)
          
          if [ -z "$APK_FILES" ]; then
            echo "❌ 未找到任何APK文件！"
            echo "检查目录结构："
            ls -la app/build/outputs/apk/ 2>/dev/null || echo "目录不存在"
            exit 1
          fi
          
          echo "✅ 找到APK文件："
          echo "$APK_FILES"
          echo ""
          
          # 显示每个APK的信息
          for apk in $APK_FILES; do
            filesize=$(stat -c%s "$apk")
            echo "📦 $(basename $apk) - $((filesize/1024)) KB"
          done
          
          # 获取第一个APK的目录
          FIRST_APK=$(echo "$APK_FILES" | head -1)
          APK_DIR=$(dirname "$FIRST_APK")
          echo "APK_DIR=$APK_DIR" >> $GITHUB_ENV

      # ✅ 上传整个release目录（保证能找到）
      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-V2-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/*.apk
          if-no-files-found: warn
          retention-days: 30

      # ✅ 备用：直接上传整个目录
      - name: 备用上传（整个目录）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APK-目录
          path: app/build/outputs/apk/
          if-no-files-found: ignore
          retention-days: 30

      # ✅ 创建Release
      - name: 创建Release并上传APK
        uses: softprops/action-gh-release@v2
        with:
          name: "灵喵 V2 - ${{ github.run_number }}"
          tag_name: "v2.0.${{ github.run_number }}"
          body: |
            ## 🎱 灵喵 V2 自动构建
            
            ### 📦 版本信息
            - 构建编号: #${{ github.run_number }}
            - 构建时间: ${{ github.event.repository.updated_at }}
            
            ### ⚠️ 重要提示
            APK可能是未签名版本，如无法安装请用MT管理器签名。
            
            ### 📱 安装步骤
            1. 下载 APK
            2. 如提示未签名，用MT管理器签名
            3. 安装到手机
            4. 授予悬浮窗权限
          files: |
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 显示下载链接
        run: |
          echo "=========================================="
          echo "✅ 构建成功！"
          echo ""
          echo "📥 下载方式1 - Artifacts（推荐）:"
          echo "   https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "📥 下载方式2 - Releases:"
          echo "   https://github.com/${{ github.repository }}/releases"
          echo ""
          echo "📂 在页面底部找到 Artifacts 区域下载APK"
          echo "=========================================="
