name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accept-licenses: false

    - name: Install NDK and Tools
      run: |
        sdkmanager "platforms;android-34"
        sdkmanager "build-tools;34.0.0"
        sdkmanager "ndk;26.1.10909125"

    - name: Download Gradle from Tencent Mirror
      run: |
        wget --no-verbose --output-document=/tmp/gradle.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
        unzip -q /tmp/gradle.zip -d /tmp/

    # 🔥 【彻底熔断】先删光云端缓存目录，再执行清理命令
    - name: Nuclear Cache Clean
      run: |
        rm -rf ~/.gradle/caches/
        /tmp/gradle-8.7/bin/gradle clean --no-daemon

    # 🔥 强制重新生成 Gradle Wrapper，彻底切断旧 jar 包关联
    - name: Force Regenerate Wrapper
      run: |
        /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7 --no-daemon

    - name: Build Debug APK
      run: |
        /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
