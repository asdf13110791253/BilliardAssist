name: LingMiao V2 Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: "26.1.10909125"

      - name: 修复Gradle包装器
        run: |
          rm -rf gradle/wrapper gradlew
          mkdir -p gradle/wrapper
          
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://gitee.com/mirrors/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          cat > gradlew << 'EOF'
          #!/bin/sh
          exec "$JAVA_HOME/bin/java" -classpath "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          
          chmod +x gradlew
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: 下载OpenCV so库
        run: |
          mkdir native_libs
          wget --no-check-certificate https://ghfast.top/https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip -O opencv.zip
          filesize=$(stat -c%s opencv.zip)
          if [ $filesize -lt 1000000 ]; then
              echo "❌ 下载文件异常"
              exit 1
          fi
          echo "✅ OpenCV下载成功"
          unzip -q opencv.zip -d native_libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native_libs/OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/

      - name: 打包Release APK（未签名）
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      # ✅ 检查并上传未签名APK
      - name: 检查并上传APK
        run: |
          echo "🔍 查找所有APK文件..."
          find app/build -name "*.apk" -type f
          echo ""
          
          # 查找未签名APK
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          
          if [ -f "$UNSIGNED_APK" ]; then
            filesize=$(stat -c%s "$UNSIGNED_APK")
            echo "✅ 未签名APK生成成功！"
            echo "✅ 路径: $UNSIGNED_APK"
            echo "✅ 大小: $((filesize/1024/1024)) MB"
            ls -lh "$UNSIGNED_APK"
          else
            echo "❌ 未找到APK文件！"
            exit 1
          fi

      # ✅ 上传未签名APK
      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-V2-APK-未签名
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      # ✅ 创建Release（标注未签名）
      - name: 创建Release并上传APK
        uses: softprops/action-gh-release@v2
        with:
          name: "灵喵 V2 - ${{ github.run_number }}"
          tag_name: "v2.0.${{ github.run_number }}"
          body: |
            ## 🎱 灵喵 V2 自动构建
            
            ### 📦 版本信息
            - 构建编号: #${{ github.run_number }}
            - 分支: ${{ github.ref_name }}
            
            ### ⚠️ 重要提示
            **此APK为未签名版本！**
            使用前请用MT管理器签名后再安装。
            
            ### 📱 安装步骤
            1. 下载 APK
            2. 用MT管理器签名
            3. 安装到手机
            4. 授予悬浮窗权限
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 显示下载链接
        run: |
          echo "=========================================="
          echo "✅ 构建成功！"
          echo ""
          echo "📥 下载地址:"
          echo "   https://github.com/${{ github.repository }}/releases"
          echo ""
          echo "⚠️ 下载后请用MT管理器签名再安装"
          echo "=========================================="
