name: LingMiao V2 Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: "26.1.10909125"

      - name: Download OpenCV
        run: |
          mkdir native_libs
          wget https://ghproxy.com/https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip -O opencv.zip
          unzip opencv.zip -d native_libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native_libs/OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/

      - name: Build APK
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: "-Dfile.encoding=UTF-8"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: output-apk
          path: app/build/outputs/apk/release/app-release.apk
