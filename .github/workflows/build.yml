name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. 安装 Android SDK 和必要的构建工具
    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        log-accept-licenses: false
    - name: Install Tools
      run: |
        sdkmanager "platforms;android-34"
        sdkmanager "build-tools;34.0.0"
        sdkmanager "ndk;26.1.10909125"

    # 2. 🔥 【绕过包装器】下载纯净 Gradle 并直接编译
    - name: Download Gradle and Build
      run: |
        # 下载纯净版 Gradle 8.7
        wget --no-verbose --output-document=/tmp/gradle.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
        unzip -q /tmp/gradle.zip -d /tmp/
        
        # 【核心改动】直接使用纯净版 Gradle 进行清理和编译，完全绕过损坏的 gradlew
        /tmp/gradle-8.7/bin/gradle clean assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
