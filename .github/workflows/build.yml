name: LingMiao V2 Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: "26.1.10909125"

      # 自动修复缺失的gradle-wrapper，不依赖本地gradlew
      - name: 修复Gradle包装器（官方方案）
        run: |
          rm -rf gradle gradlew
          # 下载官方完整gradle 8.4包装器文件
          wget https://services.gradle.org/distributions/gradle-8.4-wrapper.zip -O gradle-wrapper.zip
          mkdir -p gradle/wrapper
          unzip gradle-wrapper.zip -d gradle/wrapper
          # 生成gradlew脚本
          echo '#!/bin/sh' > gradlew
          echo 'exec "$JAVA_HOME/bin/java" -classpath "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"' >> gradlew
          chmod +x gradlew gradle/wrapper/gradle-wrapper.jar

      - name: 下载OpenCV so库
        run: |
          mkdir native_libs
          wget --no-check-certificate https://ghfast.top/https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip -O opencv.zip
          filesize=$(stat -c%s opencv.zip)
          if [ $filesize -lt 1000000 ]; then
              echo "❌ 下载文件异常，不是完整压缩包"
              exit 1
          fi
          unzip opencv.zip -d native_libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native_libs/OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/

      - name: 打包Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-V2-APK
          path: app/build/outputs/apk/release/app-release.apk
