name: LingMiao V2 Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: "26.1.10909125"

      - name: 修复Gradle包装器
        run: |
          rm -rf gradle/wrapper gradlew
          mkdir -p gradle/wrapper
          
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://gitee.com/mirrors/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          cat > gradlew << 'EOF'
          #!/bin/sh
          exec "$JAVA_HOME/bin/java" -classpath "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          
          chmod +x gradlew
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: 下载OpenCV so库
        run: |
          mkdir native_libs
          wget --no-check-certificate https://ghfast.top/https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip -O opencv.zip
          filesize=$(stat -c%s opencv.zip)
          if [ $filesize -lt 1000000 ]; then
              echo "❌ 下载文件异常，不是完整压缩包"
              exit 1
          fi
          echo "✅ OpenCV下载成功"
          unzip -q opencv.zip -d native_libs
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native_libs/OpenCV-android-sdk/sdk/native/libs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/

      - name: 打包Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8"

      # ✅ 修复：检查所有APK文件
      - name: 检查APK文件
        run: |
          echo "🔍 查找所有APK文件..."
          find app/build -name "*.apk" -type f
          echo ""
          
          # 查找最可能的APK文件
          APK_PATH=$(find app/build -name "*.apk" -type f | head -1)
          
          if [ -n "$APK_PATH" ]; then
            filesize=$(stat -c%s "$APK_PATH")
            echo "✅ APK生成成功！路径: $APK_PATH"
            echo "✅ 大小: $((filesize/1024/1024)) MB"
            ls -lh "$APK_PATH"
            echo "APK_FILE_PATH=$APK_PATH" >> $GITHUB_ENV
          else
            echo "❌ 未找到任何APK文件！"
            exit 1
          fi

      # ✅ 修复：上传找到的APK
      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: LingMiao-V2-APK
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/*/**.apk
          if-no-files-found: error
          retention-days: 30

      # ✅ 修复：使用正确的APK路径创建Release
      - name: 创建Release并上传APK
        uses: softprops/action-gh-release@v2
        with:
          name: "灵喵 V2 - ${{ github.run_number }}"
          tag_name: "v2.0.${{ github.run_number }}"
          body: |
            ## 🎱 灵喵 V2 自动构建
            
            ### 📦 版本信息
            - 构建编号: #${{ github.run_number }}
            - 构建时间: ${{ github.event.repository.updated_at }}
            - 分支: ${{ github.ref_name }}
            
            ### ✨ 功能说明
            - AI 智能瞄准辅助
            - 精准桌台计费
            - 经营数据报表
            - 支持横版/竖版模式
            
            ### 📱 安装说明
            1. 下载 APK 文件到手机
            2. 允许"安装未知来源应用"
            3. 首次运行需授予悬浮窗权限
            
            ### ⚠️ 注意事项
            本版本为自动构建版。
          files: |
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 显示下载链接
        run: |
          echo "=========================================="
          echo "✅ 构建成功！"
          echo ""
          echo "📥 下载方式1 - Artifacts:"
          echo "   https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "📥 下载方式2 - Releases:"
          echo "   https://github.com/${{ github.repository }}/releases"
          echo "=========================================="
