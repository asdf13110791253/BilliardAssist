name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. 🔥【核心修复：手动生成全新包装器】
    - name: Download Gradle and Regenerate Wrapper
      run: |
        wget --no-verbose --output-document=/tmp/gradle.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.7-bin.zip
        unzip -q /tmp/gradle.zip -d /tmp/
        # 强制用纯净版 Gradle 重新生成 Wrapper，彻底解决 jar 包损坏问题
        /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
        chmod +x gradlew

    # 2. 安装安卓编译环境
    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        log-accept-licenses: false

    - name: Install Tools
      run: |
        sdkmanager "platforms;android-34"
        sdkmanager "build-tools;34.0.0"
        sdkmanager "ndk;26.1.10909125"

    # 3. 🔥【核心修复：先清理再打包】
    - name: Clean and Build Debug APK
      run: |
        ./gradlew clean assembleDebug --no-daemon

    # 4. 上传产物
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
