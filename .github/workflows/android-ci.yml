name: Setup Android SDK

on:
  workflow_dispatch:  # 允许在 GitHub Actions 页面手动运行

jobs:
  setup-android:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Android SDK & NDK
        run: |
          set -euo pipefail

          SDK_ROOT="/home/runner/work/_temp/android-sdk"
          CMDLINE_VERSION="9477386"
          CMDLINE_ZIP="commandlinetools-linux-${CMDLINE_VERSION}_latest.zip"

          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT/cmdline-tools"

          curl -sSL "https://dl.google.com/android/repository/${CMDLINE_ZIP}" -o cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          which sdkmanager

          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses > /dev/null

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;23.1.7779620"

      - name: Verify installation
        run: |
          ls /home/runner/work/_temp/android-sdk
