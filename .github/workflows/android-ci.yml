name: Setup Android SDK

on:
  workflow_dispatch:

jobs:
  setup-android:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出你的代码
      - uses: actions/checkout@v4

      # 2. 设置 JDK 17 环境（Android 编译必需）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 安装 Android SDK 和 NDK (核心修复步骤)
      - name: Install Android SDK & NDK
        run: |
          set -euo pipefail

          # 定义 SDK 存放路径
          SDK_ROOT="$GITHUB_WORKSPACE/android-sdk"
          # 定义命令行工具版本
          CMDLINE_VERSION="9477386"

          echo "正在创建 SDK 目录..."
          mkdir -p "$SDK_ROOT/cmdline-tools"

          echo "安装依赖（curl/unzip）..."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip
          sudo rm -rf /var/lib/apt/lists/*

          cd "$SDK_ROOT/cmdline-tools"

          echo "正在下载命令行工具..."
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_VERSION}_latest.zip" -o cmdline.zip

          echo "正在解压..."
          unzip -q cmdline.zip

          # 重命名目录，解决 sdkmanager 二进制找不到的问题
          mv cmdline-tools latest || true

          echo "正在配置环境变量..."
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"

          echo "正在接受许可并安装组件..."
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses > /dev/null

          # 安装所需的 SDK 组件和 NDK
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;23.1.7779620"

      # 4. (可选) 验证一下是否安装成功
      - name: Verify Installation
        run: |
          echo "✅ SDK 安装路径:"
          ls -la "$GITHUB_WORKSPACE/android-sdk/cmdline-tools/" || true
