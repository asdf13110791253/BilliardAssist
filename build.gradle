// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

// 已删除 allprojects 代码块：彻底解决和 settings.gradle 的仓库配置冲突
// OpenCV等依赖的仓库地址已统一迁移到 settings.gradle 中管理，符合Gradle 7+官方规范

task clean(type: Delete) {
    delete rootProject.buildDir
}
